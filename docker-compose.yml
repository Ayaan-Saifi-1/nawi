version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: nawi-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nawi_metrology
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nawi-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/nawi_metrology
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the root .env file}"
      REPORT_INTEGRITY_SECRET: "${REPORT_INTEGRITY_SECRET:?Set REPORT_INTEGRITY_SECRET in the root .env file}"
      REPORT_SIGNING_SERVICE_URL: "${REPORT_SIGNING_SERVICE_URL:?Configure the external PKI signing service URL}"
      REPORT_SIGNING_SERVICE_TOKEN: "${REPORT_SIGNING_SERVICE_TOKEN:?Set the PKI signing service token}"
      REPORT_SIGNING_KEY_ID: "${REPORT_SIGNING_KEY_ID:?Set the PKI key identifier}"
      REPORT_SIGNING_CERTIFICATE_B64: "${REPORT_SIGNING_CERTIFICATE_B64:?Set the base64 PEM signing certificate}"
      REPORT_SIGNING_TRUSTED_FINGERPRINTS: "${REPORT_SIGNING_TRUSTED_FINGERPRINTS:?Set trusted certificate fingerprint(s)}"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nawi-client
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - server

volumes:
  mongo_data:
